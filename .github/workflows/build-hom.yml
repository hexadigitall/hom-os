name: Build HOM - All Platforms
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  # ─────────────────────────────────────────────
  # ANDROID (APK + AAB + Split APKs)
  # ─────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Setup local.properties
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" >> local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release || echo "Flutter exit code: $? (APK may still exist)"
          echo "--- Searching for APK ---"
          mkdir -p build/app/outputs/flutter-apk
          # Gradle 9.x puts APK in android/app/build/outputs/ instead of build/
          for p in \
            "android/app/build/outputs/flutter-apk/app-release.apk" \
            "android/app/build/outputs/apk/release/app-release.apk" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            "build/app/outputs/apk/release/app-release.apk"; do
            if [ -f "$p" ]; then
              echo "FOUND APK: $p"
              cp "$p" build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || true
            fi
          done
          # Verify we have an APK
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK ready at build/app/outputs/flutter-apk/app-release.apk"
          else
            echo "WARNING: No APK found anywhere!"
            find . -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
        working-directory: mobile

      - name: Build AAB
        run: |
          flutter build appbundle --release || echo "Flutter exit code: $? (AAB may still exist)"
          echo "--- Searching for AAB ---"
          mkdir -p build/app/outputs/bundle/release
          for p in \
            "android/app/build/outputs/bundle/release/app-release.aab" \
            "build/app/outputs/bundle/release/app-release.aab"; do
            if [ -f "$p" ]; then
              echo "FOUND AAB: $p"
              cp "$p" build/app/outputs/bundle/release/app-release.aab 2>/dev/null || true
            fi
          done
          if [ ! -f build/app/outputs/bundle/release/app-release.aab ]; then
            echo "WARNING: No AAB found!"
            find . -name "*.aab" -type f 2>/dev/null || true
            exit 1
          fi
        working-directory: mobile

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi || echo "Flutter exit code: $? (split APKs may still exist)"
          echo "--- Searching for split APKs ---"
          mkdir -p build/app/outputs/flutter-apk
          for p in android/app/build/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$p" ]; then
              echo "FOUND split APK: $p"
              cp "$p" build/app/outputs/flutter-apk/ 2>/dev/null || true
            fi
          done
          count=$(ls build/app/outputs/flutter-apk/app-*-release.apk 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "WARNING: No split APKs found!"
            find . -name "app-*-release.apk" -type f 2>/dev/null || true
            exit 1
          fi
        working-directory: mobile

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOM-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Split-APKs
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HOM-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────
  # iOS (IPA)
  # ─────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-iOS
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # WINDOWS (Desktop - MSIX Installer)
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create MSIX Installer (unsigned)
        run: dart run msix:create --sign-msix false
        shell: bash

      - name: Sign MSIX with Windows SDK signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found in Windows SDK" }
          $msix = Get-ChildItem "build\windows\x64\runner\Release\*.msix" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $msix) { throw "no .msix produced by msix:create" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f windows\hom-sign.pfx /p HOM-CI-2026 $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Windows
          path: mobile/build/windows/x64/runner/Release/

      - name: Stage MSIX installer package
        shell: pwsh
        run: |
          $stage = "build\windows\installer"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $msix = Get-ChildItem "build\windows\x64\runner\Release\*.msix" | Select-Object -First 1
          if (-not $msix) { throw "no .msix produced by msix:create" }
          Copy-Item $msix.FullName -Destination $stage
          Copy-Item windows\hom-sign.cer -Destination $stage
          Copy-Item windows\install-msix.ps1 -Destination $stage
          Get-ChildItem $stage | Select-Object Name, Length

      - name: Upload MSIX installer package
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Msix-Installer
          path: mobile/build/windows/installer/

  # ─────────────────────────────────────────────
  # LINUX (Desktop - .deb Package)
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create .deb package
        run: |
          BUNDLE=build/linux/x64/release/bundle
          DEB_DIR=build/deb/hom_2.0.1_amd64
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/lib/hom"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy bundle contents
          cp -r "$BUNDLE"/* "$DEB_DIR/usr/lib/hom/"

          # Create wrapper script
          printf '#!/bin/sh\nexec /usr/lib/hom/hom "$@"\n' > "$DEB_DIR/usr/bin/hom"
          chmod +x "$DEB_DIR/usr/bin/hom"

          # Copy desktop file
          cp linux/com.hom.hospitality_ops.desktop "$DEB_DIR/usr/share/applications/"

          # Copy icon
          if [ -f "$BUNDLE/data/flutter_assets/assets/logo/logo.png" ]; then
            cp "$BUNDLE/data/flutter_assets/assets/logo/logo.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/com.hom.hospitality_ops.png"
          fi

          # Create control file (no leading spaces in field values)
          printf 'Package: hom\nVersion: 2.0.1\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Hexadigitall <info@hexadigitall.com>\nDescription: HOM - Hospitality Operations Manager\n A hospitality operations management application\n for managing rooms, bookings, diesel, inventory, staff, and vendors.\nDepends: libgtk-3-0\n' > "$DEB_DIR/DEBIAN/control"

          dpkg-deb --build "$DEB_DIR" "build/hom_2.0.1_amd64.deb"

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Linux
          path: mobile/build/linux/x64/release/bundle/

      - name: Upload Linux .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Linux-Deb
          path: mobile/build/hom_2.0.1_amd64.deb

  # ─────────────────────────────────────────────
  # macOS (Desktop)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS (no codesign)
        run: flutter build macos --release

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-macOS
          path: mobile/build/macos/Build/Products/Release/
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # WEB
  # ─────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /flutter-web/

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Web
          path: mobile/build/web/

  # ─────────────────────────────────────────────
  # WEB DEPLOY (GitHub Pages)
  # ─────────────────────────────────────────────
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Build Web
        working-directory: mobile
        run: flutter build web --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─────────────────────────────────────────────
  # RELEASE (publish artifacts to GitHub Releases)
  # ─────────────────────────────────────────────
  release:
    needs: [build-android, build-windows, build-linux, build-macos, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        working-directory: artifacts
        run: |
          set -e
          mkdir -p ../staging
          # Android single-file installers
          find HOM-APK -name "*.apk" | head -1 | xargs -I{} cp {} ../staging/HOM-APK.apk
          find HOM-AAB -name "*.aab" | head -1 | xargs -I{} cp {} ../staging/HOM-AAB.aab
          cp HOM-Linux-Deb/*.deb ../staging/HOM-Linux-Deb.deb
          # Split APKs → one zip
          find HOM-Split-APKs -name "app-*-release.apk" -print0 | zip -q ../staging/HOM-Split-APKs.zip -0 -@ 2>/dev/null || true
          # Desktop bundles (folder → single zip each)
          zip -q -r ../staging/HOM-Windows.zip HOM-Windows
          zip -q -r ../staging/HOM-Msix-Cert.zip HOM-Msix-Installer
          zip -q -r ../staging/HOM-Linux.zip HOM-Linux
          zip -q -r ../staging/HOM-macOS.zip HOM-macOS
          zip -q -r ../staging/HOM-Web.zip HOM-Web
          echo "--- Staged files ---"
          ls -la ../staging

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: HOM v${{ github.run_number }}
          body: |
            Automated release build for HOM — the Hotel Operating System for Nigerian hotels.

            Downloads
            - Android APK (`HOM-APK.apk`)
            - Android AAB (`HOM-AAB.aab`)
            - Split APKs (`HOM-Split-APKs.zip`)
            - Windows (`HOM-Windows.zip`)
            - Windows MSIX + certificate (`HOM-Msix-Cert.zip`)
            - Linux bundle (`HOM-Linux.zip`)
            - Linux DEB (`HOM-Linux-Deb.deb`)
            - macOS (`HOM-macOS.zip`)
            - Web build (`HOM-Web.zip`)

            Web app: https://app.hom.com.ng
          files: |
            staging/*

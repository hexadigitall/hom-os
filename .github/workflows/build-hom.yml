name: Build HOM - All Platforms
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  # ─────────────────────────────────────────────
  # ANDROID (APK + AAB + Split APKs)
  # ─────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Setup local.properties
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" >> local.properties

      - name: Create keystore
        working-directory: mobile/android/app
        run: |
          keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android -alias upload \
            -dname "CN=HOM, OU=Hexadigitall, O=HOM, L=PH, S=Rivers, C=NG"

      - name: Create key.properties
        working-directory: mobile/android
        run: |
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=android
          keyAlias=upload
          keyPassword=android
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOM-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Split-APKs
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HOM-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab

  # ─────────────────────────────────────────────
  # iOS (IPA)
  # ─────────────────────────────────────────────
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-iOS
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # WINDOWS (Desktop - MSIX Installer)
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create MSIX Installer
        run: dart run msix:create --certificate-path "null" --certificate-password ""

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Windows-Portable
          path: mobile/build/windows/x64/runner/Release/

      - name: Upload Windows MSIX Installer
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Windows-Installer
          path: mobile/build/windows/x64/runner/Release/*.msix
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # LINUX (Desktop - .deb Package)
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev \
            liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create .deb package
        run: |
          BUNDLE=build/linux/x64/bundle
          DEB_DIR=build/deb/hom_2.0.0_amd64
          mkdir -p "$DEB_DIR/DEBIAN"
          mkdir -p "$DEB_DIR/usr/bin"
          mkdir -p "$DEB_DIR/usr/lib/hom"
          mkdir -p "$DEB_DIR/usr/share/applications"
          mkdir -p "$DEB_DIR/usr/share/icons/hicolor/256x256/apps"

          # Copy bundle contents
          cp -r "$BUNDLE"/* "$DEB_DIR/usr/lib/hom/"

          # Create wrapper script
          cat > "$DEB_DIR/usr/bin/hom" << 'WRAPPER'
          #!/bin/sh
          exec /usr/lib/hom/hom "$@"
          WRAPPER
          chmod +x "$DEB_DIR/usr/bin/hom"

          # Copy desktop file
          cp linux/com.hom.hospitality_ops.desktop "$DEB_DIR/usr/share/applications/"

          # Copy icon
          if [ -f "$BUNDLE/data/flutter_assets/assets/logo/logo.png" ]; then
            cp "$BUNDLE/data/flutter_assets/assets/logo/logo.png" "$DEB_DIR/usr/share/icons/hicolor/256x256/apps/com.hom.hospitality_ops.png"
          fi

          # Create control file
          cat > "$DEB_DIR/DEBIAN/control" << EOF
          Package: hom
          Version: 2.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hexadigitall <info@hexadigitall.com>
          Description: HOM - Hospitality Operations Manager
           A comprehensive hospitality operations management application
           for managing rooms, bookings, diesel, inventory, staff, and vendors.
          Depends: libgtk-3-0
          EOF

          dpkg-deb --build "$DEB_DIR" "build/hom_2.0.0_amd64.deb"

      - name: Upload Linux Bundle
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Linux
          path: mobile/build/linux/x64/bundle/

      - name: Upload Linux .deb Package
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Linux-Deb
          path: mobile/build/hom_2.0.0_amd64.deb

  # ─────────────────────────────────────────────
  # macOS (Desktop)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS (no codesign)
        run: flutter build macos --release

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-macOS
          path: mobile/build/macos/Build/Products/Release/
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # WEB
  # ─────────────────────────────────────────────
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href ./

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Web
          path: mobile/build/web/

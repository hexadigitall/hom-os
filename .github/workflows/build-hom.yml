name: Build HOM APK + AAB (v5 FINAL)
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-hom.yml'
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.3', channel: 'stable' }

      - name: Setup Android properties
        working-directory: mobile/android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> local.properties
          echo "flutter.versionCode=2" >> local.properties
          echo "flutter.versionName=2.0.0" >> local.properties
          cat local.properties

      - name: Create keystore
        working-directory: mobile/android/app
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -alias upload -dname "CN=HOM, OU=Hexadigitall, O=HOM, L=PH, S=Rivers, C=NG"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          fi

      - name: Create key.properties
        working-directory: mobile/android
        run: |
          echo "storeFile=upload-keystore.jks" > key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD || 'android' }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS || 'upload' }}" >> key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD || 'android' }}" >> key.properties

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK + AAB
        working-directory: mobile
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: HOM-APKs-v5
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HOM-AAB-v5-PlayStore
          path: mobile/build/app/outputs/bundle/release/app-release.aab

name: Build HOM APK + AAB
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Setup local.properties
        working-directory: mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "flutter.sdk=$(which flutter | xargs dirname | xargs dirname)" >> local.properties

      - name: Create keystore
        working-directory: mobile/android/app
        run: |
          keytool -genkey -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -alias upload -dname "CN=HOM, OU=Hexadigitall, O=HOM, L=PH, S=Rivers, C=NG"

      - name: Create key.properties
        working-directory: mobile/android
        run: |
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=android
          keyAlias=upload
          keyPassword=android
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOM-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: HOM-Split-APKs
          path: mobile/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: HOM-AAB
          path: mobile/build/app/outputs/bundle/release/app-release.aab

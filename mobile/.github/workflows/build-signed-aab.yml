name: Build Signed AAB + APK
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0' }
      - name: Generate keystore if not exists
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            keytool -genkey -v -keystore android/app/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=HOM, OU=Hexadigitall, O=hom.com.ng, L=PH, S=Rivers, C=NG"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          fi
      - run: cd mobile && flutter pub get && flutter build apk --release && flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: hom-apk-aab
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab

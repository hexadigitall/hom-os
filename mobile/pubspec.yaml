name: hom_mobile
description: HOM — Hospitality Operations Manager
publish_to: 'none'
version: 2.0.1+2
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.2.0
  file_picker: ^8.0.0
  csv: ^6.0.0
  excel: ^4.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  share_plus: ^10.0.0
  flutter_local_notifications: ^18.0.0
  permission_handler: ^11.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0
  app_links: ^6.3.0
dependency_overrides:
  firebase_core: 4.12.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8
flutter:
  uses-material-design: true
  assets:
    - assets/logo/

msix_config:
  display_name: HOM
  publisher_display_name: Hexadigitall
  identity_name: com.hexadigitall.hom
  publisher: CN=Hexadigitall, O=Hexadigitall, C=NG
  logo_path: windows/runner/resources/app_icon.png
  capabilities: internetClient
  languages: en-us
  msix_version: 2.0.1.0
  install_certificate: false

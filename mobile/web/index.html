<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HOM - Hospitality Operations Manager">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HOM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HOM - Hospitality Operations Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F6F7F5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .loading {
      text-align: center;
    }
    .loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E0E0E0;
      border-top: 4px solid #0E9F6E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading h2 {
      color: #0E1A14;
      font-size: 18px;
      margin: 0 0 4px 0;
      font-weight: 700;
    }
    .loading p {
      color: #666;
      font-size: 13px;
      margin: 0;
    }
    .loading .error {
      display: none;
      color: #D32F2F;
      margin-top: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading-indicator">
    <div class="spinner"></div>
    <h2>HOM</h2>
    <p>Loading Hospitality Operations Manager...</p>
    <div class="error" id="load-error">
      Failed to load. Please refresh the page or try a different browser.
    </div>
  </div>

  <script>
    // Show error message if Flutter fails to load within 15 seconds
    var loadTimeout = setTimeout(function() {
      var err = document.getElementById('load-error');
      if (err) err.style.display = 'block';
    }, 15000);

    // Hide loading indicator once Flutter renders
    window.flutterConfiguration = window.flutterConfiguration || {};
    window._flutterLoaded = function() {
      clearTimeout(loadTimeout);
      var el = document.getElementById('loading-indicator');
      if (el) el.style.display = 'none';
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HOM - Hospitality Operations Manager">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HOM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HOM - Hospitality Operations Manager</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F6F7F5;
    }
    #loading-indicator {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F6F7F5;
      z-index: 9999;
      transition: opacity 0.3s;
    }
    #loading-indicator.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #E0E0E0;
      border-top: 4px solid #0E9F6E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading h2 {
      color: #0E1A14;
      font-size: 18px;
      margin: 0 0 4px 0;
      font-weight: 700;
    }
    .loading p {
      color: #666;
      font-size: 13px;
      margin: 0;
    }
    .loading .error {
      display: none;
      color: #D32F2F;
      margin-top: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div style="text-align:center;">
      <div class="spinner"></div>
      <h2>HOM</h2>
      <p>Loading Hospitality Operations Manager...</p>
      <div class="error" id="load-error">
        Taking too long? Try refreshing the page.
      </div>
    </div>
  </div>

  <script>
    // Show error if Flutter hasn't rendered within 20 seconds
    var loadTimeout = setTimeout(function() {
      var err = document.getElementById('load-error');
      if (err) err.style.display = 'block';
    }, 20000);

    // Watch for Flutter canvas and hide loader
    var observer = new MutationObserver(function(mutations) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('canvas') || document.querySelector('flutter-view')) {
        clearTimeout(loadTimeout);
        var el = document.getElementById('loading-indicator');
        if (el) {
          el.classList.add('fade-out');
          setTimeout(function() { el.remove(); }, 400);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
